name: OLX watcher

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC; GitHub may delay a few min)
  workflow_dispatch: {}       # allow manual run from the Actions tab

# needed so the job can commit the updated seen.json back to the repo
permissions:
  contents: write

concurrency:
  group: olx-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional overrides (defaults = Запоріжжя / легкові / не розмитнені / до 200к грн):
          # OLX_CATEGORY_ID: "108"
          # OLX_REGION_ID: "17"
          # OLX_EXTRA_PARAMS: "filter_enum_cleared_customs[0]=no&filter_float_price:to=200000"
        run: python olx_watch.py

      - name: Persist seen.json
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: update seen.json [skip ci]"
            git push
          else
            echo "No changes to seen.json"
          fi
